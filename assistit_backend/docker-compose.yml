services:
  postgres:
    image: postgres:16
    container_name: assistit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistit
      POSTGRES_PASSWORD: assistit_pwd
      POSTGRES_DB: assistit_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:latest
    container_name: assistit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: assistit_admin
      MINIO_ROOT_PASSWORD: assistit_pwd_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data: